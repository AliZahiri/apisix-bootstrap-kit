services:
  apisix:
    image: apache/apisix:${APISIX_IMAGE_TAG:-3.9.0-debian}
    container_name: apisix
    restart: unless-stopped
    volumes:
      - /opt/apisix/core/apisix_cnf.yml:/usr/local/apisix/conf/config.yaml:ro
    depends_on:
      - etcd
    ##network_mode: host
    ports:
      - "80:9080/tcp"
      - "9443:9443/tcp"
      - "9180:9180/tcp"
      - "9091:9091/tcp"
      - "9092:9092/tcp"
    networks:
      apisix:

  etcd:
    image: bitnami/etcd:3.5.11
    container_name: etcd
    restart: unless-stopped
    volumes:
      - etcd_data:/bitnami/etcd
      - /opt/apisix/etcd/etcd.conf.yml:/opt/bitnami/etcd/conf/etcd.conf.yml

    environment:
      ETCD_ENABLE_V2: "true"
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
    ports:
      - "2379:2379/tcp"
    networks:
      apisix:

  dashboard:
    image: "apache/apisix-dashboard:3.0.0-alpine"
    container_name: apisix-dashboard
    restart: unless-stopped
    depends_on:
      - apisix
    volumes:
      - /opt/apisix/dashboard/apisix_dsh_cnf.yml:/usr/local/apisix-dashboard/conf/conf.yaml:ro
    ports:
      - "9100:9000"
    networks:
      - apisix

  apisix-setup:
    image: curlimages/curl:latest
    container_name: apisix-setup
    depends_on:
      - apisix
    entrypoint:
      - sh
      - -c
      - |
        echo "⏳ Waiting for APISIX to be ready...";
        while ! curl -s http://apisix:9180/apisix/admin/routes -H "X-API-KEY: ${APISIX_ADMIN_KEY}"; do
          sleep 2;
        done;
        echo "✅ APISIX is ready. Creating sample route...";
        curl -i -X PUT http://apisix:9180/apisix/admin/routes/1 \
          -H "X-API-KEY: ${APISIX_ADMIN_KEY}" \
          -H "Content-Type: application/json" \
          -d '{
            "uri": "/google",
            "methods": ["GET"],
            "upstream": {
              "type": "roundrobin",
              "nodes": {
                "google.com:443": 1
              }
            }
          }';
        echo "🎉 Sample route created!"

    networks:
      - apisix


networks:
  apisix:
    driver: bridge

volumes:
  etcd_data:
    driver: local
