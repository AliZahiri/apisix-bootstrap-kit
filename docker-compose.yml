services:
  apisix:
    image: apache/apisix:${APISIX_IMAGE_TAG:-3.19.0-debian}
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config/apisix_cnf.yml.tpl:/usr/local/apisix/conf/config.yaml:ro
    depends_on:
      etcd:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APISIX_HTTP_PORT:-8080}:9080/tcp"
      - "127.0.0.1:${APISIX_HTTPS_PORT:-8443}:9443/tcp"
      - "127.0.0.1:${APISIX_ADMIN_PORT:-9180}:9180/tcp"
      - "127.0.0.1:${APISIX_METRICS_PORT:-9091}:9091/tcp"
    networks:
      apisix:

  etcd:
    image: gcr.io/etcd-development/etcd:v3.5.35
    restart: unless-stopped
    command:
      - etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      apisix:


networks:
  apisix:
    driver: bridge

volumes:
  etcd_data:
    driver: local
